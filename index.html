// ─── UTILITY ───────────────────────────────────────────────────────────────────
function fmt(v, type) {
  if (v === null || v === undefined || v === '') return '—';
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  if (type === 'currency') return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
  if (type === 'pct') return (n * 100).toFixed(1) + '%';
  if (type === 'int') return Math.round(n).toLocaleString('en-US');
  if (type === 'dec') return n.toFixed(2);
  return n.toLocaleString('en-US', {maximumFractionDigits: 2});
}

function metricFormat(key) {
  if (['Sales','Advertising cost','Gross profit'].includes(key)) return 'currency';
  if (['Organic Units %','Real ACOS','Margin','Unit session percentage','Organic Units%','ROI'].includes(key)) return 'pct';
  if (['Units','PPC Units','Organic Units','Sessions'].includes(key)) return 'int';
  return 'dec';
}

function changeClass(v, positive_is_good) {
  if (v === null || isNaN(v)) return 'neutral';
  return (positive_is_good ? v > 0 : v < 0) ? 'up' : (positive_is_good ? v < 0 : v > 0) ? 'down' : 'neutral';
}

function rankClass(r) {
  const s = String(r).trim();
  if (['-','','nan','NaN'].includes(s)) return 'rank-na';
  if (s.startsWith('>') || parseInt(s) > 200) return 'rank-over200';
  const n = parseInt(s);
  if (isNaN(n)) return 'rank-na';
  if (n <= 10) return 'rank-1-10';
  if (n <= 20) return 'rank-11-20';
  if (n <= 30) return 'rank-21-30';
  if (n <= 50) return 'rank-31-50';
  if (n <= 100) return 'rank-51-100';
  if (n <= 200) return 'rank-101-200';
  return 'rank-over200';
}

function rankNum(r) {
  const s = String(r).trim();
  if (s.startsWith('>')) return 999;
  if (['-','','nan','NaN'].includes(s)) return 9999;
  const n = parseInt(s);
  return isNaN(n) ? 9999 : n;
}

function buildDashboard() {
  const w18 = 0, w17 = 1;

  const kpis = [
    { label: 'Total Sales', key: 'Sales', fmt: 'currency', good: true, accent: '' },
    { label: 'Total Units', key: 'Units', fmt: 'int', good: true, accent: '' },
    { label: 'Organic Units', key: 'Organic Units', fmt: 'int', good: true, accent: 'accent-green' },
    { label: 'Organic %', key: 'Organic Units %', fmt: 'pct', good: true, accent: 'accent-green' },
    { label: 'Gross Profit', key: 'Gross profit', fmt: 'currency', good: true, accent: 'accent-blue' },
    { label: 'Real ACOS', key: 'Real ACOS', fmt: 'pct', good: false, accent: 'accent-red' },
    { label: 'Margin', key: 'Margin', fmt: 'pct', good: true, accent: '' },
    { label: 'Ad Spend', key: 'Advertising cost', fmt: 'currency', good: false, accent: 'accent-red' },
    { label: 'Sessions', key: 'Sessions', fmt: 'int', good: true, accent: 'accent-blue' },
    { label: 'Conv. Rate', key: 'Unit session percentage', fmt: 'pct', good: true, accent: '' },
    { label: 'ROI', key: 'ROI', fmt: 'dec', good: true, accent: '' },
    { label: 'PPC Units', key: 'PPC Units', fmt: 'int', good: false, accent: '' },
  ];

  const grid = document.getElementById('kpi-grid');
  grid.innerHTML = '';

  kpis.forEach(k => {
    const v18 = WOW[k.key] ? WOW[k.key][w18] : null;
    const v17 = WOW[k.key] ? WOW[k.key][w17] : null;
    let chgHtml = '';
    if (v17 !== null && v17 !== 0 && v18 !== null) {
      const pct = ((v18 - v17) / Math.abs(v17)) * 100;
      const cls = changeClass(pct, k.good);
      const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '–';
      chgHtml = `<div class="kpi-change ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}% vs ${WEEKS[1]}</div>`;
    }
    // For ad cost: show absolute value
    const displayVal = k.key === 'Advertising cost' ? fmt(Math.abs(v18), k.fmt) : fmt(v18, k.fmt);
    grid.innerHTML += `
      <div class="kpi-card ${k.accent}">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${displayVal}</div>
        ${chgHtml}
      </div>`;
  });

  // Charts
  const labels = [...WEEKS].reverse();
  const getSeries = (key) => [...(WOW[key] || [])].reverse().map(v => v !== null ? parseFloat(v) || 0 : 0);

  const chartDefaults = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } } },
    scales: { x: { ticks: { font: { size: 10 }, maxRotation: 45 } }, y: { ticks: { font: { size: 10 } } } }
  };

  // Sales
  new Chart(document.getElementById('chart-sales'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Sales ($)', data: getSeries('Sales'),
        borderColor: '#FF9900', backgroundColor: 'rgba(255,153,0,0.08)',
        borderWidth: 2.5, pointRadius: 4, pointBackgroundColor: '#FF9900', fill: true, tension: 0.3
      }]
    },
    options: { ...chartDefaults }
  });

  // Units stacked bar
  new Chart(document.getElementById('chart-units'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Organic Units', data: getSeries('Organic Units'), backgroundColor: '#067D62', borderRadius: 3 },
        { label: 'PPC Units', data: getSeries('PPC Units'), backgroundColor: '#FF9900', borderRadius: 3 }
      ]
    },
    options: { ...chartDefaults, scales: { ...chartDefaults.scales, x: { ...chartDefaults.scales.x, stacked: true }, y: { ...chartDefaults.scales.y, stacked: true } } }
  });

  // ACOS & Margin
  new Chart(document.getElementById('chart-acos'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Real ACOS', data: getSeries('Real ACOS').map(v => +(v*100).toFixed(1)), borderColor: '#e55039', borderWidth: 2, pointRadius: 3, tension: 0.3, yAxisID: 'y' },
        { label: 'Margin', data: getSeries('Margin').map(v => +(v*100).toFixed(1)), borderColor: '#067D62', borderWidth: 2, pointRadius: 3, tension: 0.3, borderDash: [5,3], yAxisID: 'y' }
      ]
    },
    options: { ...chartDefaults, scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => v + '%' } } } }
  });

  // Gross Profit
  new Chart(document.getElementById('chart-gp'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Gross Profit ($)', data: getSeries('Gross profit'),
        backgroundColor: getSeries('Gross profit').map(v => v >= 0 ? 'rgba(6,125,98,0.75)' : 'rgba(229,80,57,0.75)'),
        borderRadius: 3
      }]
    },
    options: { ...chartDefaults }
  });

  // WoW Table
  const tbl = document.getElementById('wow-table');
  const metricKeys = ['Sales','Units','PPC Units','Organic Units','Organic Units %','Advertising cost','Gross profit','Real ACOS','Margin','ROI','Sessions','Unit session percentage'];
  const metricGood = { 'Real ACOS': false, 'Advertising cost': false };

  let hdr = '<thead><tr><th>Metric</th>';
  WEEKS.forEach(w => hdr += `<th>${w}</th>`);
  hdr += '</tr></thead><tbody>';

  let rows = '';
  metricKeys.forEach(key => {
    if (!WOW[key]) return;
    const isGood = metricGood[key] === false ? false : true;
    rows += `<tr><td class="metric-label">${key}</td>`;
    WOW[key].forEach((v, i) => {
      const f = key === 'Advertising cost' ? fmt(Math.abs(v), metricFormat(key)) : fmt(v, metricFormat(key));
      let cls = '';
      if (i > 0 && WOW[key][i-1] !== null && v !== null) {
        const chg = ((v - WOW[key][i-1]) / Math.abs(WOW[key][i-1] || 1));
        if (Math.abs(chg) > 0.05) cls = (isGood ? chg > 0 : chg < 0) ? ' class="positive"' : ' class="negative"';
      }
      rows += `<td${cls}>${f}</td>`;
    });
    rows += '</tr>';
  });

  tbl.innerHTML = hdr + rows + '</tbody>';
}

function buildSkuTabs() {
  const nav = document.getElementById('tab-nav');

  Object.entries(SKUS).forEach(([sku, d]) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';

    btn.setAttribute('onclick', `showPage('sku-${sku}', this)`);

    page.id = `page-sku-${sku}`;
    page.innerHTML = buildSkuHtml(sku, d);

}

      <div class="kw-section">
        <h3>🔑 Keyword Organic Rankings</h3>
        <div class="rank-legend">
          <strong style="font-size:11px;color:#636e72">Rank Color Guide:</strong>
          <div class="rank-legend-item"><div class="legend-box lb-1"></div> #1–10</div>
          <div class="rank-legend-item"><div class="legend-box lb-2"></div> #11–20</div>
          <div class="rank-legend-item"><div class="legend-box lb-3"></div> #21–30</div>
          <div class="rank-legend-item"><div class="legend-box lb-4"></div> #31–50</div>
          <div class="rank-legend-item"><div class="legend-box lb-5"></div> #51–100</div>
          <div class="rank-legend-item"><div class="legend-box lb-6"></div> #101–200</div>
          <div class="rank-legend-item"><div class="legend-box lb-7"></div> >200/Out</div>
        </div>
        <div class="kw-search"><input type="text" placeholder="🔍 Search keywords..." oninput="filterKw(this, '${kwId}')" /></div>
        <div style="overflow-x:auto">
          <table class="table-striped" id="kw-tbl-${sku}">
            ${kwTh}
            <tbody id="${kwId}">${kwRows}</tbody>
          </table>
        </div>
      </div>`;
  } else {
    kwHtml = `<div class="kw-section"><div class="no-data">No keyword ranking data available for this SKU.</div></div>`;
  }

  return header + perfHtml + kwHtml;
}

// ─── INTERACTIONS ───────────────────────────────────────────────────────────────
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`page-${id}`).classList.add('active');
  btn.classList.add('active');
}

function filterKw(input, tbodyId) {
  const val = input.value.toLowerCase();
  const rows = document.getElementById(tbodyId).querySelectorAll('tr');
  rows.forEach(r => {
    const kw = r.cells[0] ? r.cells[0].textContent.toLowerCase() : '';
    r.style.display = kw.includes(val) ? '' : 'none';
  });
}

let sortState = {};
function sortKwTable(th, sku, col) {
  const key = sku + '-' + col;
  const asc = sortState[key] !== 'asc';
  sortState[key] = asc ? 'asc' : 'desc';

  // Update header arrows
  const tbl = document.getElementById(`kw-tbl-${sku}`);
  tbl.querySelectorAll('th').forEach(t => { t.classList.remove('asc','desc'); });
  th.classList.add(asc ? 'asc' : 'desc');

  const tbody = tbl.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a, b) => {
    const ca = a.cells[col] ? a.cells[col].textContent.trim() : '';
    const cb = b.cells[col] ? b.cells[col].textContent.trim() : '';
    if (col === 1) { // numeric sort
      return asc ? (parseInt(ca)||0) - (parseInt(cb)||0) : (parseInt(cb)||0) - (parseInt(ca)||0);
    }
    return asc ? ca.localeCompare(cb) : cb.localeCompare(ca);
  });
  rows.forEach(r => tbody.appendChild(r));
}

// ─── INIT ───────────────────────────────────────────────────────────────────────
const latestWeek = WEEKS[0];
const oldestWeek = WEEKS[WEEKS.length - 1];
document.getElementById('current-week-label').textContent = latestWeek + ' — Latest';
document.getElementById('report-date').textContent = 'Report Period: ' + oldestWeek + ' – ' + latestWeek;
document.getElementById('dashboard-week-badge').textContent = latestWeek + ' — Most Recent';

buildDashboard();
buildSkuTabs();
</script>
